[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-tracker-local"
version = "0.1.0"
description = "K12 教育知识点掌握程度跟踪系统的本地原型"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "Codex", email = "noreply@example.com" }
]

[project.scripts]
edu-tracker = "edu_tracker.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["edu_tracker*", "services*"]

