[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qizhi-tracker-local"
version = "0.1.2"
description = "启智知踪 K12 智能学习诊断系统的本地原型"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "周冰", email = "41794400@qq.com" }
]

[project.scripts]
edu-tracker = "edu_tracker.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["edu_tracker*", "services*"]
